# Render Blueprint for the Sure Seal Production system (static site).
services:
  - type: web
    name: sure-seal-production
    runtime: static
    buildCommand: ""
    staticPublishPath: ./app
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
