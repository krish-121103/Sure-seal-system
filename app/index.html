const col=k=>{const c=S.db.collection(P[k]);if(!SITE_KEYS.includes(k)&&k!=='mov')return c;return {doc:id=>c.doc(id),add:d=>c.add({site:S.site,...d})}};
async function addMove(m){await col('mov').add({...m,at:nowIso(),by:S.who})}

function siblingsOf(code){const p=S.prod[code];if(!p||!p.formula)return p?[p]:[];return vals(S.prod).filter(x=>x.formula===p.formula&&!x.packOf&&x.active!==false).sort((a,b)=>n(a.fillKg)-n(b.fillKg)||byCode(a,b))}
function plFillsHtml(code){const sib=siblingsOf(code);const p=S.prod[code];
  if(!p)return '';if(!p.formula)return `<p class="small muted">Link ${esc(code)} to a formula in Setup → Products before planning.</p>`;
  return `<div class="stack" style="margin-top:6px"><div class="small"><b>Pack sizes from this batch</b> <span class="muted">· formula ${esc(p.formula)} · fill one or more sizes from the same bulk mix. Leave blank to fill only by batch size.</span></div>
  <div class="tbl"><table><tr><th>Pack size</th><th class="num">Fill per unit</th><th>Cartons</th><th style="width:120px">Units to fill</th><th class="num">Bulk needed</th></tr>
  ${sib.map(x=>{const k=packsFor(x.code)[0];return `<tr><td>${esc(x.name)} <span class="muted code">${esc(x.code)}</span></td><td class="num">${n(x.fillKg)?fq(x.fillKg)+' kg':'<span class="pill warn">Set fill</span>'}</td><td class="small">${k?`${esc(k.code)} · ${fq(k.perPack)} per carton`:'—'}</td><td><input type="number" min="0" step="1" id="pf-${esc(x.code)}" data-pf="${esc(x.code)}" ${n(x.fillKg)?'':'disabled'} placeholder="0"></td><td class="num" id="pfkg-${esc(x.code)}">—</td></tr>`}).join('')}
  <tr><td colspan="4" class="num"><b>Total bulk incl. loss allowance</b></td><td class="num"><b id="pf-total">—</b></td></tr></table></div></div>`}
function planSize(p,units){const loss=p.lossPct==null||p.lossPct===''?3:n(p.lossPct);return Math.ceil(units*n(p.fillKg)*(1+loss/100))}
async function planMulti(pc,p,f,fills,size,date,id){
  const pack=[];
  for(const fl of fills){const q=S.prod[fl.product];
    (q.packaging||[]).forEach(x=>pack.push({rm:x.rm,per:n(x.qty),req:r3(n(x.qty)*fl.planned),prod:fl.product}));
    const k=packsFor(fl.product).filter(k=>k.box&&n(k.perPack)>0)[0];
    if(k)pack.push({rm:k.box,per:0,perBox:n(k.perPack),carton:k.code,req:Math.floor(fl.planned/n(k.perPack)),prod:fl.product});
    else if(q.box&&n(q.perBox)>0)pack.push({rm:q.box,per:0,perBox:n(q.perBox),req:Math.ceil(fl.planned/n(q.perBox)),prod:fl.product})}
  const doc={site:S.site,product:fills[0].product,fills,formula:f.id,fver:f.version||1,date,sizeKg:size,status:'planned',unitsPlanned:fills.reduce((s,x)=>s+x.planned,0),
    lines:(f.lines||[]).map(l=>({rm:l.rm,req:r3(size*n(l.pct)/100),act:null,lot:'',note:l.note||''})),pack,created:nowIso(),createdBy:S.who};
  await col('bat').doc(id).set(doc);toast(`${id} scheduled for ${nice(date)}: ${fills.map(x=>`${fq(x.planned)} × ${x.product}`).join(', ')}.`);
  S.tab='batches';S.sel=id;render();
}
async function planBatch(){
  const pc=$('pl-prod').value,date=$('pl-date').value;let size=n($('pl-size').value);
  const p=S.prod[pc];if(!p)return toast('Choose a product.',1);
  const cust=($('pl-cust')?.value||'').trim(),oref=($('pl-ref')?.value||'').trim(),ounits=Math.round(n($('pl-units')?.value)),odue=$('pl-due')?.value||'';
  if(p.mto&&(!cust||ounits<1))return toast(`${p.name} is made to order. Enter the customer and the units required.`,1);
  if((cust||oref)&&ounits<1)return toast('Enter how many units the customer needs.',1);
  if(ounits>0&&!cust)return toast('Enter the customer name for this order.',1);
  if(ounits>0&&size<=0)size=planSize(p,ounits);
  const fills=siblingsOf(pc).map(x=>({product:x.code,planned:Math.round(n($('pf-'+x.code)?.value))})).filter(x=>x.planned>0);
  if(fills.length&&ounits>0)return toast('For a customer order, plan one pack size only. Clear the pack size table or the order units.',1);
  if(fills.length){const kgNet=fills.reduce((s,f)=>s+f.planned*n(S.prod[f.product].fillKg),0);const loss=p.lossPct==null||p.lossPct===''?3:n(p.lossPct);
    if(size<=0)size=Math.ceil(kgNet*(1+loss/100));
    if(kgNet>size+0.0005)return toast(`The pack sizes need ${fq(kgNet)} kg but the batch is ${fq(size)} kg. Increase the batch size or reduce units.`,1)}
  if(ounits>0&&n(p.fillKg)>0&&Math.floor(size/n(p.fillKg))<ounits)return toast(`${fq(size)} kg only fills ${Math.floor(size/n(p.fillKg))} units. The order needs ${ounits}.`,1);
  const f=S.form[p.formula];if(!f)return toast(`${pc} has no formula linked. Set one in Setup → Products.`,1);
  if(size<=0)return toast('Enter the batch size in kg.',1);if(!date)return toast('Choose a production date.',1);
  const pre=(siteObj().prefix||'SS-')+date.slice(2).replace(/-/g,'')+'-';let k=1;while((R.bat||{})[pre+pad(k)])k++;const id=pre+pad(k);
  if(fills.length===1&&fills[0].product!==pc){return toast('Choose that pack size as the product at the top, or fill more than one size.',1)}
  if(fills.length>1)return planMulti(pc,p,f,fills,size,date,id);
  const units=fills.length===1?fills[0].planned:(n(p.fillKg)>0?Math.floor(size/n(p.fillKg)):0);
  const doc={...(ounits>0?{order:{customer:cust,ref:oref,units:ounits,due:odue}}:{}),site:S.site,product:pc,formula:f.id,fver:f.version||1,date,sizeKg:size,status:'planned',unitsPlanned:units,
    lines:(f.lines||[]).map(l=>({rm:l.rm,req:r3(size*n(l.pct)/100),act:null,lot:'',note:l.note||''})),
    pack:(p.packaging||[]).map(x=>({rm:x.rm,per:n(x.qty),req:r3(n(x.qty)*units)})).concat(packsFor(pc).length?packsFor(pc).filter(k=>k.box&&n(k.perPack)>0).slice(0,1).map(k=>({rm:k.box,per:0,perBox:n(k.perPack),carton:k.code,req:ounits>0?0:Math.floor(units/n(k.perPack))})):(p.box&&n(p.perBox)>0?[{rm:p.box,per:0,perBox:n(p.perBox),req:Math.ceil(units/n(p.perBox))}]:[])),created:nowIso(),createdBy:S.who};
  await col('bat').doc(id).set(doc);toast(`${id} scheduled for ${nice(date)}.`);
  S.tab='batches';S.sel=id;render();
}

function allocate(rm,qty,pref){
  if(nonStock(rm))return {out:[],short:0};
  const lots=lotsFor(rm);let order=lots;if(pref){const pl=lots.find(l=>l.id===pref);if(pl)order=[pl,...lots.filter(l=>l.id!==pref)]}
  const out=[];let left=qty;for(const l of order){if(left<=0.0005)break;const t=Math.min(left,n(l.qtyLeft));out.push({id:l.id,lot:l.lot,qty:r3(t)});left-=t}
  return {out,short:left>0.0005?left:0}}

async function releaseMulti(b,to){
  const plan=[];const rel=to==='released';
  for(const l of b.lines||[]){const q=n(l.act)>0?n(l.act):n(l.req);const a=allocate(l.rm,q,l.lot);if(a.short)return toast(`Not enough ${l.rm} in stock (short ${fq(a.short)}). Receive the material first.`,1);l.used=a.out;plan.push(...a.out)}
  const out={},packs={};let total=0;
  for(const f of fillsOf(b)){const u=rel?Math.round(unitsFor(b,f.product)):0;let inP=0;
    if(rel)for(const k of packsFor(f.product)){const m=packMade(b,k.code);const c=Math.max(0,Math.round(n(m!=null?m:defPacks(b,k.code,u))));packs[k.code]={made:c,left:c};inP+=c*n(k.perPack)}
    if(inP>u)return toast(`${f.product}: cartons packed hold ${fq(inP)} units, but only ${fq(u)} were filled.`,1);
    out[f.product]={filled:u,made:u-inP,left:u-inP};total+=u}
  const kg=fillsOf(b).reduce((s,f)=>s+out[f.product].filled*n(S.prod[f.product]?.fillKg),0);
  if(rel&&kg>n(b.sizeKg)*1.02)return toast(`Units filled need ${fq(kg)} kg, more than the ${fq(b.sizeKg)} kg batch. Check the units filled.`,1);
  for(const l of b.pack||[]){const u=rel?out[l.prod]?.filled||0:0;const q=l.carton?(rel?n(packs[l.carton]?.made):0):packQty(l,u);const a=allocate(l.rm,q,'');if(a.short)return toast(`Not enough ${l.rm} in stock (short ${fq(a.short)}).`,1);l.used=a.out;l.req=r3(q);plan.push(...a.out)}
  const agg={};plan.forEach(u=>agg[u.id]=(agg[u.id]||0)+u.qty);
  for(const id of Object.keys(agg)){await col('lot').doc(id).update({qtyLeft:r3(n(S.lot[id].qtyLeft)-agg[id])})}
  b.unitsMade=total;b.unitsLeft=0;b.out=out;b.packs=packs;b.releasedAt=nowIso();b.releasedBy=S.who;
  const sh=n(S.prod[b.product]?.shelfMonths);if(rel&&sh)b.expiry=addMonths(today(),sh);
  b.status=to;const id=S.sel;delete b.id;await col('bat').doc(id).set(b);
  await addMove({type:rel?'production':'reject',batch:id,product:b.product,units:total,fills:Object.entries(out).map(([k,v])=>({product:k,units:v.filled,loose:v.made})),cartons:Object.entries(packs).map(([k,v])=>({product:k,qty:v.made}))});
  S.confirm=null;toast(rel?`${id} released: ${Object.entries(out).map(([k,v])=>`${fq(v.filled)} × ${k}`).join(', ')}.`:`${id} rejected and materials written off.`);
}
async function setStatus(to){
  const b=JSON.parse(JSON.stringify(S.bat[S.sel]));if(!b)return;
  if(to==='released'||to==='rejected'){
    const units=to==='released'?(n(b.unitsMade)||n(b.unitsPlanned)):n(b.unitsMade);
    const plan=[];
    for(const l of b.lines||[]){const q=n(l.act)>0?n(l.act):n(l.req);const a=allocate(l.rm,q,l.lot);if(a.short)return toast(`Not enough ${l.rm} in stock (short ${fq(a.short)}). Receive the material first.`,1);l.used=a.out;plan.push(...a.out)}
    if(isMulti(b))return releaseMulti(b,to);
    const pk=packsFor(b.product);const packs={};let inPacks=0;
    if(to==='released')for(const k of pk){const c=Math.max(0,Math.round(n(packMade(b,k.code)!=null?packMade(b,k.code):defPacks(b,k.code,units))));packs[k.code]={made:c,left:c};inPacks+=c*n(k.perPack)}
    if(inPacks>units)return toast(`Cartons packed hold ${fq(inPacks)} units, but only ${fq(units)} were filled. Check the carton count.`,1);
    for(const l of b.pack||[]){const q=l.carton?(to==='released'?n(packs[l.carton]?.made):0):packQty(l,units);const a=allocate(l.rm,q,'');if(a.short)return toast(`Not enough ${l.rm} in stock (short ${fq(a.short)}).`,1);l.used=a.out;l.req=r3(q);plan.push(...a.out)}
    const agg={};plan.forEach(u=>agg[u.id]=(agg[u.id]||0)+u.qty);
    for(const id of Object.keys(agg)){await col('lot').doc(id).update({qtyLeft:r3(n(S.lot[id].qtyLeft)-agg[id])})}
    b.unitsMade=units;b.unitsLeft=to==='released'?units-inPacks:0;if(pk.length)b.packs=packs;b.releasedAt=nowIso();b.releasedBy=S.who;
    if(b.order&&to==='released'){b.resLeft=Math.min(n(b.order.units),units);b.surplus=Math.max(0,units-n(b.order.units));if(units<n(b.order.units))setTimeout(()=>toast(`Only ${units} units made. ${b.order.customer} ordered ${b.order.units}.`,1),2800)}
    const sh=n(S.prod[b.product]?.shelfMonths);if(to==='released'&&sh)b.expiry=addMonths(today(),sh);
    b.status=to;delete b.id;await col('bat').doc(S.sel).set(b);
    await addMove({type:to==='released'?'production':'reject',batch:S.sel,product:b.product,units:to==='released'?units:0});
    S.confirm=null;toast(to==='released'?`${S.sel} released. ${inPacks?Object.entries(packs).filter(x=>x[1].made).map(([k,v])=>`${fq(v.made)} × ${k}`).join(', ')+' and ':''}${fq(units-inPacks)} loose units added to stock.`:`${S.sel} rejected and materials written off.`);
  }else{await col('bat').doc(S.sel).update({status:to,[to==='inprod'?'startedAt':'madeAt']:nowIso()});toast(`${S.sel} moved to ${STATUS[to]}.`)}
}

async function receive(){
  const po=$('rc-po').value.trim(),rm=$('rc-rm').value,qty=n($('rc-qty').value),lot=$('rc-lot').value.trim(),exp=$('rc-exp').value,docket=$('rc-ref').value.trim();
  if(!po)return toast('Enter the PO number. Every delivery must be received against a PO.',1);
  if(!rm)return toast('Choose the item received.',1);
  if(qty<=0)return toast('Enter the quantity received.',1);
  if(!lot)return toast('Enter the supplier lot number from the label. It is needed for traceability.',1);
  const norm=v=>String(v).replace(/\s+/g,'').toUpperCase();
  let line=S.pick&&S.exp[S.pick]&&S.exp[S.pick].rm===rm&&norm(S.exp[S.pick].po)===norm(po)?S.exp[S.pick]:null;
  if(!line)line=openExp().find(x=>x.rm===rm&&norm(x.po)===norm(po))||null;
  await col('lot').add({rm,lot,qtyIn:qty,qtyLeft:qty,received:today(),expiry:exp||'',po,docket,by:S.who});
  let msg=`Received ${fq(qty)} ${matUnit(rm)} of ${rm}, lot ${lot}.`;
  if(line){const got=r3(n(line.received)+qty);const full=got+0.0005>=n(line.qty);
    await col('exp').doc(line.id).update(full?{received:got,status:'received',closed:nowIso()}:{received:got});
    if(full&&line.req&&S.req[line.req])await col('req').doc(line.req).update({status:'received',closed:nowIso()});
    msg+=full?` PO ${line.po} line complete.`:` ${fq(n(line.qty)-got)} still due on PO ${line.po}.`;}
  else msg+=` No expected line matched PO ${po}, so it was logged as an unplanned delivery.`;
  await addMove({type:'receive',rm,qty,lot,po,docket,line:line?line.id:''});
  toast(msg);S.pick=null;render();
}
async function addExp(){
  const po=$('ex-po').value.trim(),rm=$('ex-rm').value,qty=n($('ex-qty').value),due=$('ex-due').value,note=$('ex-note').value.trim();
  if(!po)return toast('Enter the PO number.',1);if(!rm)return toast('Choose the item ordered.',1);if(qty<=0)return toast('Enter the quantity ordered.',1);
  await col('exp').add({po,rm,qty,received:0,due:due||'',note,status:'open',created:nowIso(),by:S.who});
  toast(`Added ${rm} to PO ${po}.`);
  render();const p=$('ex-po');if(p){p.value=po;$('ex-due').value=due;$('ex-rm').focus()}
}
async function dispatch(){
  const pc=$('dp-prod').value,qty=Math.round(n($('dp-qty').value)),cust=$('dp-cust').value.trim(),ref=$('dp-ref').value.trim();
  if(qty<=0)return toast(`Enter the number of ${uomOf(pc)}.`,1);if(!cust)return toast('Enter the customer name.',1);
  const al=allocFG(pc,qty,cust);if(al.short>0)return toast(`Only ${fq(qty-al.short)} ${uomOf(pc)} of ${pc} are available to ${cust}. Other stock is reserved for other customers' orders.`,1);
  const lines=al.lines.map(l=>({batch:l.batch,qty:l.qty}));
  for(const l of al.lines){const b=S.bat[l.batch];const upd=isPack(pc)?{packs:{[pc]:{left:qtyIn(b,pc)-l.qty}}}:(b.out?{out:{[pc]:{left:qtyIn(b,pc)-l.qty}}}:{unitsLeft:n(b.unitsLeft)-l.qty});if(l.res)upd.resLeft=Math.max(0,n(b.resLeft)-l.res);await col('bat').doc(l.batch).update(upd)}
  await addMove({type:'dispatch',product:pc,qty,customer:cust,ref,lines});
  toast(`Dispatched ${qty} ${uomOf(pc)} of ${pc} to ${cust} from ${lines.map(l=>l.batch).join(', ')}.`);['dp-qty','dp-cust','dp-ref'].forEach(i=>$(i).value='');
}

/* Tidy up: discontinue, merge duplicates, delete unused */

async function mergeMat(old,to){

  for(const l of u.lots)await col('lot').doc(l.id).update({rm:to,mergedFrom:old});
  const swap=lines=>{const o=[];(lines||[]).forEach(l=>{const r=l.rm===old?to:l.rm;const ex=o.find(x=>x.rm===r);if(ex&&l.pct!=null){ex.pct=r3(n(ex.pct)+n(l.pct))}else if(ex&&l.qty!=null){ex.qty=r3(n(ex.qty)+n(l.qty))}else o.push({...l,rm:r})});return o};

  for(const id of u.open){const b={...(R.bat||S.bat)[id]};delete b.id;b.lines=(b.lines||[]).map(l=>l.rm===old?{...l,rm:to}:l);b.pack=(b.pack||[]).map(l=>l.rm===old?{...l,rm:to}:l);await col('bat').doc(id).set(b)}

}

async function mergeProd(old,to){

    r[k2]=typeof a==='object'?Object.fromEntries([...new Set([...Object.keys(a),...Object.keys(b)])].map(k=>[k,n(a[k])+n(b[k])])):n(a)+n(b);return r};

}

  const db=makeDb(sb);S.db=db;
  $('role').textContent=ROLE_NAME[S.role];$('acct').textContent=S.who;
  $('role').title=S.admin?'You can see formulas, costs and ingredient names':'Formulas and costs are hidden from this login';
  if(!tabAllowed(S.tab)||(!S.admin&&['formulas','costing','forecast'].includes(S.tab))||(S.tab==='formulas'&&!S.owner))S.tab='overview';
  renderTabs();
  const keys=['lab','sds','req','cnt','cfg','exp','mat','lot','prod','bat'].concat(S.admin?['smat','sprod','sales'].concat(S.owner?['form']:[]):[]);
  let left=keys.length+1;const done=()=>{if(--left===0){S.ready=true;render()}else if(S.ready)schedule()};
  keys.forEach(k=>{let first=true;db.collection(P[k]).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});if(SITE_KEYS.includes(k)){R[k]=o;const f={};vals(o).forEach(x=>{if(onSite(x))f[x.id]=x});S[k]=f}else S[k]=o;if(k==='cfg'){applyBrand();refilter()}if(first){first=false;done()}else schedule()},err=>{console.warn(k,err);if(first){first=false;done()}})});
  if(S.admin&&!S.owner){left++;let firstB=true;const loadB=async()=>{try{const {data,error}=await sb.rpc('formula_brief',{});if(!error){const o={};(data||[]).forEach(r=>o[r.id]={id:r.id,...r.data});S.form=o}}catch(_){}
    if(firstB){firstB=false;done()}else schedule()};loadB();setInterval(loadB,120000);window.addEventListener('focus',loadB)}
  let firstM=true;db.collection(P.mov).orderBy('at','desc').limit(500).onSnapshot(s=>{R.mov=s.docs.map(d=>({id:d.id,...d.data()}));S.mov=R.mov.filter(onSite);if(firstM){firstM=false;done()}else schedule()},err=>{console.warn('mov',err);if(firstM){firstM=false;done()}});
})();
})();
</script>
